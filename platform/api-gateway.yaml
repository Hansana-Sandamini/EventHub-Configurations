spring:

    cloud:
        gateway:
            server:
                webflux:
                    routes:
                        - id: user-service
                          uri: lb://USER-SERVICE
                          predicates:
                              - Path=/api/v1/users/**

                        - id: event-service
                          uri: lb://EVENT-SERVICE
                          predicates:
                              - Path=/api/v1/events/**

                        - id: registration-service
                          uri: lb://REGISTRATION-SERVICE
                          predicates:
                              - Path=/api/v1/registrations/**

                    default-filters:
                        - PreserveHostHeader

                    globalcors:
                        cors-configurations:
                            '[/**]':
                                allowedOrigins: "*"
                                allowedOriginPatterns: "*"
                                allowed-methods: "*"
                                allowed-headers: "*"
server:
    port: 7000
